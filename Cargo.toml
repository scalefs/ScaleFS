[workspace]
resolver = "3"
members = [
    "crates/scalefs-core",
    "crates/scalefs-ipc",
    "crates/scalefs-mount",
    "crates/scalefs-daemon",
    "crates/scalefs-cli",
    "crates/scalefs-ffi",
    "crates/scalefs-shell",
]

[workspace.package]
version = "1.0.0-preview.1"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
repository = "https://github.com/scalefs/scalefs"


[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
missing_safety_doc = "allow"
undocumented_unsafe_blocks = "allow"
